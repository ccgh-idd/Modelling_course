<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>What makes a good model?</title>
  <style>
    :root {
      --navy: #00355f;
      --green: #7ab51d;
      --bg: #f3f6fb;
      --panel: #ffffff;
      --ink: #14212e;
      --muted: #5c6b82;
      --rule: #d8dfe6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --navy: #f4b6d2;
        --bg: #0e1520;
        --panel: #182232;
        --ink: #e4eaf3;
        --muted: #9aa8bc;
        --rule: #2c3a4f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Aptos", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border-top: 6px solid var(--navy);
      padding: 24px 20px;
      border-radius: 4px;
    }
    h1 { margin: 0 0 6px; font-size: 1.5rem; color: var(--navy); }
    p { margin: 0 0 18px; color: var(--muted); }
    input {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      padding: 12px;
      font-size: 1.05rem;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: var(--bg);
      color: var(--ink);
    }
    button {
      width: 100%;
      padding: 13px;
      font-size: 1.05rem;
      font-weight: 600;
      border: 0;
      border-radius: 4px;
      background: var(--green);
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #status { margin-top: 14px; min-height: 1.4em; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>What makes a good model?</h1>
    <p>Add up to three words. They will appear in the word cloud on the slide.</p>
    <form id="form">
      <input maxlength="30" placeholder="Word 1" autocomplete="off" required>
      <input maxlength="30" placeholder="Word 2" autocomplete="off">
      <input maxlength="30" placeholder="Word 3" autocomplete="off">
      <button type="submit">Submit</button>
    </form>
    <div id="status" role="status"></div>
  </main>

  <script>
    // Must match WORDCLOUD_TOPIC in lecture-slides.html.
    const WORDCLOUD_TOPIC = "ccgh-course-good-model-q7k2m9";

    const form = document.getElementById("form");
    const status = document.getElementById("status");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const inputs = [...form.querySelectorAll("input")];
      const words = inputs.map((i) => i.value.trim()).filter(Boolean);
      if (!words.length) return;

      button.disabled = true;
      status.textContent = "Sending...";
      try {
        // All words go in one message to stay within ntfy's per-network rate limit.
        const response = await fetch(`https://ntfy.sh/${WORDCLOUD_TOPIC}`, { method: "POST", body: words.join("\n") });
        if (!response.ok) throw new Error(response.status);
        inputs.forEach((i) => (i.value = ""));
        status.textContent = "Thanks! Your words are on the slide. Add more if you like.";
      } catch (error) {
        status.textContent = "Could not send, please try again in a few seconds.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
